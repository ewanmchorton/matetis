name: Build GitHub Pages

on:
  push:
    branches:
      - cursor/social-gamification-1d5c
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pages показывает только экраны прототипа. Серверная часть (вход, база)
      # там работать не может, поэтому перед сборкой её убираем.
      - name: Remove server routes
        run: rm -rf src/app/api

      - name: Build static site
        run: pnpm build
        env:
          GITHUB_PAGES: "true"

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: out
          retention-days: 1
