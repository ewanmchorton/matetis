# Локальная разработка: база PostgreSQL и почтовый ящик Mailpit.
# Запуск: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matetis}
      POSTGRES_USER: ${POSTGRES_USER:-matetis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matetis}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ловит все письма приложения. Просмотр писем: http://localhost:8025
  mail:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  db-data:
