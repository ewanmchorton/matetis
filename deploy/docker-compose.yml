# Сервер МАТЭТИС: приложение, база PostgreSQL и Caddy (HTTPS).
# Настройки – в deploy/.env (шаблон – deploy/.env.example, в Git не попадает).
# Запуск из папки deploy: docker compose up -d
name: matetis-server

services:
  app:
    image: ${APP_IMAGE:-matetis-app}
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_URL: https://${DOMAIN}
      MIGRATE_ON_START: "true"
    volumes:
      - files:/app/private
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Каждую ночь копия базы в S3, хранятся BACKUP_KEEP_DAYS дней. Команды – в deploy/backup/.
  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: Europe/Minsk
      BACKUP_HOUR: "03"
      BACKUP_KEEP_DAYS: "14"
      S3_BUCKET: ${S3_BUCKET}
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: Other
      RCLONE_CONFIG_S3_ENDPOINT: ${S3_ENDPOINT}
      RCLONE_CONFIG_S3_REGION: ${S3_REGION}
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy

  # Принимает запросы из интернета и сам получает сертификат HTTPS для DOMAIN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  files:
  caddy-data:
  caddy-config:
